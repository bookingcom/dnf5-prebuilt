# Builds the dnf5 distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    # One job cross-compiles every platform with the hermetic LLVM toolchain,
    # so the platforms share the Bazel server, exec tools and caches.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Test
        run: >
          bazel --bazelrc=.github/workflows/ci.bazelrc test
          --config=linux_amd64 -c opt //bazel/tests/...
      - name: Build
        run: |
          mkdir -p dist
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt //bazel/release:dist
          cp -L bazel-bin/bazel/release/dnf5-*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dnf5
          path: dist/*.tar.gz
          if-no-files-found: error
