# Builds the dnf5 distribution archive of every supported platform.
# Reused by ci.yaml and release.yml.
name: Build

on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  build:
    # One job cross-compiles every platform with the hermetic LLVM toolchain,
    # so the platforms share the Bazel server, exec tools and caches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Test
        run: >
          bazel --bazelrc=.github/workflows/ci.bazelrc test
          --config=linux_amd64 -c opt -- //bazel/tests/... -//bazel/tests/layer/...
      - name: Test the rules
        # For the host platform, not --config=linux_amd64: no execution
        # platform matches the glibc constraints of //bazel:linux_amd64, so no
        # test toolchain resolves and its tests cannot run.
        run: >
          bazel --bazelrc=.github/workflows/ci.bazelrc test
          //bazel/tests/layer/... //dnf5-prebuilt/private/...
      - name: Build
        run: |
          mkdir -p dist
          bazel --bazelrc=.github/workflows/ci.bazelrc build -c opt //bazel/release:dist
          cp -L bazel-bin/bazel/release/dnf5-*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dnf5
          path: dist/*.tar.gz
          if-no-files-found: error
