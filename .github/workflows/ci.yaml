name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of the same PR or branch, except on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  e2e:
    # Runs e2e/smoke_test, which consumes the public API (dnf5-prebuilt/) like
    # a user would, against the archives built above on Linux and macOS.
    name: e2e (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            ol10_image: ol10_curl_amd64_image
            ol10_load_target: load_ol10_curl_amd64_image
            scratch_image: ol10_scratch_curl_amd64_image
            scratch_load_target: load_ol10_scratch_curl_amd64_image
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            ol10_image: ol10_curl_arm64_image
            ol10_load_target: load_ol10_curl_arm64_image
            scratch_image: ol10_scratch_curl_arm64_image
            scratch_load_target: load_ol10_scratch_curl_arm64_image
          - os: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dnf5
          path: dist
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Smoke test
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //...
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Build Oracle Linux 10 container image
        if: runner.os == 'Linux'
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc build //:${{ matrix.ol10_image }}
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Load Oracle Linux 10 container image into Docker
        if: runner.os == 'Linux'
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc run //:${{ matrix.ol10_load_target }}
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Run curl --version in Oracle Linux 10 container
        if: runner.os == 'Linux'
        run: docker run --network none --rm localhost/e2e-ol10-curl-test:latest curl --version
      - name: Scratch image e2e test
        working-directory: e2e/scratch_image
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //...
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Build Oracle Linux 10 scratch container image
        if: runner.os == 'Linux'
        working-directory: e2e/scratch_image
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc build //:${{ matrix.scratch_image }}
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Load Oracle Linux 10 scratch container image into Docker
        if: runner.os == 'Linux'
        working-directory: e2e/scratch_image
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc run //:${{ matrix.scratch_load_target }}
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Run curl --version in Oracle Linux 10 scratch container
        if: runner.os == 'Linux'
        run: docker run --network none --rm localhost/e2e-ol10-scratch-curl:latest curl --version
      - name: Load OL9 container image into Docker
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc run //:load_ol9_curl_image
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Validate OL9 container execution offline
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/smoke_test
        run: ./validate_image.sh localhost/e2e-curl-test:latest
      - name: Collect artifacts
        if: runner.os == 'Linux' && always()
        run: |
          mkdir -p artifacts
          cp -f e2e/smoke_test/bazel-bin/*.lock.json artifacts/ || true
          cp -f e2e/smoke_test/bazel-bin/*rpmdb*.sqlite artifacts/ || true
          cp -f e2e/scratch_image/bazel-bin/*.lock.json artifacts/ || true
          cp -f e2e/scratch_image/bazel-bin/*rpmdb*.sqlite artifacts/ || true
          docker save -o artifacts/ol10_curl_image.tar localhost/e2e-ol10-curl-test:latest || true
          docker save -o artifacts/ol10_scratch_curl_image.tar localhost/e2e-ol10-scratch-curl:latest || true
          if [ "${{ matrix.platform }}" = "linux-amd64" ]; then
            docker save -o artifacts/ol9_curl_image.tar localhost/e2e-curl-test:latest || true
          fi
          ls -la artifacts/
      - name: Upload e2e artifacts
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: warn

  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Check Starlark formatting
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          # Committed registry modules are immutable, so they are not checked.
          git ls-files '*.bazel' '*.bzl' | grep -v '^bazel/3rdparty/modules/' | xargs buildifier -mode=check -lint=warn
