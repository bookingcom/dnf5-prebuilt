name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of the same PR or branch, except on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  e2e:
    # Runs e2e/smoke_test, which consumes the public API (dnf5-prebuilt/) like
    # a user would, against the archives built above on Linux and macOS.
    # Both Linux runners build the x86_64 and the aarch64 layers, so each one
    # verifies and merges RPMs of the other architecture. On macOS the
    # image-based targets are incompatible with the host and skipped; only the
    # negative GPG check below exercises rpm_layer there.
    name: e2e (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/download-artifact@v8
        with:
          name: dnf5
          path: dist
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Smoke test
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //...
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: GPG verification rejects RPMs without a trusted key
        working-directory: e2e/smoke_test
        run: |
          if bazel --bazelrc=../../.github/workflows/ci.bazelrc build //:ol9_curl_nokey_layer_tar \
              --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist >nokey.log 2>&1; then
            cat nokey.log
            echo "::error::rpm_layer(gpgcheck = True) accepted RPMs signed with an unknown key"
            exit 1
          fi
          if ! grep -q "NOKEY" nokey.log; then
            cat nokey.log
            echo "::error::the build failed, but not on the missing signing key"
            exit 1
          fi
      - name: Load container image into Docker
        # The base image is pulled for linux/amd64 only.
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc run //:load_ol9_curl_image
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
      - name: Validate container execution offline
        if: matrix.platform == 'linux-amd64'
        working-directory: e2e/smoke_test
        run: ./validate_image.sh localhost/e2e-curl-test:latest
      - name: Collect artifacts
        if: matrix.platform == 'linux-amd64' && always()
        run: |
          mkdir -p artifacts
          cp -f e2e/smoke_test/bazel-bin/*.lock.json artifacts/ || true
          cp -f e2e/smoke_test/bazel-bin/*rpmdb*.sqlite artifacts/ || true
          docker save -o artifacts/ol9_curl_image.tar localhost/e2e-curl-test:latest || true
          ls -la artifacts/
      - name: Upload e2e artifacts
        if: matrix.platform == 'linux-amd64' && always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: warn

  sanitizers:
    # ASan + LSan + UBSan: the linux_amd64 archive built with --config=asan
    # (dnf5 and every C/C++ dependency instrumented), and e2e/smoke_test run
    # against it. Third-party findings that are not ours to fix go into
    # sanitizers/*.supp, each with its reason. The rpm_lock and rpm_mark build
    # actions do not see --test_env: ASan and LSan fail them by default, UBSan
    # only reports there; the tests that run dnf5 themselves halt on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-endpoint: ${{ vars.BUILDBUDDY_ENDPOINT }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build the sanitized archive
        run: |
          version=$(sed -n 's/^DNF5_VERSION = "\(.*\)"$/\1/p' bazel/extensions.bzl)
          bazel --bazelrc=.github/workflows/ci.bazelrc build --config=linux_amd64 --config=asan //bazel/release:dnf5
          mkdir -p dist
          cp -L bazel-bin/bazel/release/dnf5.tar.gz "dist/dnf5-${version}-linux_amd64.tar.gz"
      - name: e2e under ASan + LSan + UBSan
        working-directory: e2e/smoke_test
        run: >
          bazel --bazelrc=../../.github/workflows/ci.bazelrc test //...
          --repo_env=DNF5_PREBUILT_DIST_DIR=${{ github.workspace }}/dist
          --test_env=ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1:print_summary=1
          --test_env=LSAN_OPTIONS=suppressions=${{ github.workspace }}/sanitizers/lsan.supp:print_suppressions=0
          --test_env=UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/sanitizers/ubsan.supp
          --test_output=errors

  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check Starlark formatting
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /usr/local/bin/buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/buildifier-linux-amd64
          chmod +x /usr/local/bin/buildifier
          # Committed registry modules are immutable, so they are not checked.
          git ls-files '*.bazel' '*.bzl' | grep -v '^bazel/3rdparty/modules/' | xargs buildifier -mode=check -lint=warn
