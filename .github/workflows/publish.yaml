# Publish new releases to the Bazel Central Registry.
name: Publish

on:
  # Run after a successful release (release.yml).
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  # Let release engineers retry from the GitHub UI.
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@1ae09341a6014e9bea052879c42392ac6b8b632c # v1.7.0
    with:
      tag_name: ${{ inputs.tag_name }}
      # Fork of bazelbuild/bazel-central-registry the pull request is opened from.
      registry_fork: bookingcom/bazel-central-registry
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
