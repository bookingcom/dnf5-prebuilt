# Cut a release whenever a version tag (v<dnf5 version>[.<n>]) is pushed.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dnf5
          path: dist
      - name: Prepare release
        run: .github/workflows/release_prep.sh "$TAG" dist >release_notes.md
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dnf5-prebuilt-*.tar.gz
      - name: Generate attestation assets
        run: |
          cat "${{ steps.attest.outputs.bundle-path }}" | jq --compact-output > "dnf5-prebuilt-${TAG}.tar.gz.intoto.jsonl"
          for f in dist/*.tar.gz; do
            cat "${{ steps.attest.outputs.bundle-path }}" | jq --compact-output > "${f}.intoto.jsonl"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/*.intoto.jsonl
            dnf5-prebuilt-*.tar.gz
            dnf5-prebuilt-*.tar.gz.intoto.jsonl
          fail_on_unmatched_files: true

  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
