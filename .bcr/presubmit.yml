bcr_test_module:
  module_path: "e2e/smoke_test"
  matrix:
    bazel: ["8.x", "9.x"]
    # Linux only: CI never runs the macOS binaries; they are cross-compiled on Linux (.github/workflows/build.yaml).
    platform: ["debian11", "ubuntu2204", "ubuntu2404", "ubuntu2204_arm64"]
  tasks:
    run_test_module:
      name: "Run test module"
      bazel: ${{ bazel }}
      platform: ${{ platform }}
      test_targets:
        - "//..."
